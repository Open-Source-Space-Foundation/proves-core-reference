# Software-in-the-loop board (sim/README.md).

# Flight boards are tickless at 10000 ticks/s. native_sim defaults to 100, which rounds the 1 ms
# rate-group base timer up to 10 ms and runs every rate group 10x slow.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Storage: FAT on the sim-flash storage partition instead of an SPI SD card.
CONFIG_SDHC=n
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_DISK_DRIVER_FLASH=y

CONFIG_EMUL=y
CONFIG_LSM6DSO_ENABLE_TEMP=y
CONFIG_RTC=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_UPDATE=y
CONFIG_LORA=y

# OTA path (FlashWorker): image manager and bootutil without a real MCUboot.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

# Zephyr logs go to host stdout, not to the F' pty.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_NATIVE_POSIX=y
CONFIG_LOG_BACKEND_UART=n

# native_sim forces its stdout console (POSIX_ARCH_CONSOLE); the F' link is on the pty, so this is safe.
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=n
# sys_reboot() re-execs the process (WARM_RESET / COLD_RESET)
CONFIG_NATIVE_SIM_REBOOT=y
# No MCUboot image signing for a host executable.
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE=""
CONFIG_PINCTRL=n
