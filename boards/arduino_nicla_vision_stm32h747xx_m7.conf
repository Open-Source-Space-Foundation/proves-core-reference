# Nicla Vision M7 overlay. prj.conf is the flight-controller configuration from main.
# These settings keep the Nicla image on the picolibc heap, USB clock, and thread
# pool that the working deployment used, and leave off hardware this board does not have.

CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_COMMON_LIBC_MALLOC=n

CONFIG_PRINTK=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_USBD_THREAD_STACK_SIZE=4096

CONFIG_POSIX_FILE_SYSTEM=n
CONFIG_FILE_SYSTEM=n
CONFIG_SDHC=n
CONFIG_DISK_ACCESS=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_FS_FATFS_EXFAT=n
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_FSTAB_AUTOMOUNT=n
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_HAPTICS=n
CONFIG_HAPTICS_DRV2605=n
CONFIG_I2C_TCA954X=n

CONFIG_BUILD_OUTPUT_UF2=y
