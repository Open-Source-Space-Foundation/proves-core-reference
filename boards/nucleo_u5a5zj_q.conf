# NUCLEO-U5A5ZJ-Q bring-up: the FC v5e defconfig settings that are not
# RP2350-specific. Direct boot (no MCUboot) at the start of flash.
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_BOOTLOADER_MCUBOOT=n

CONFIG_I2C_TCA954X=y
CONFIG_I2C_TCA954X_ROOT_INIT_PRIO=70
CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO=71

CONFIG_SENSOR=y
CONFIG_LSM6DSO=y
CONFIG_LSM6DSO_ENABLE_TEMP=y
CONFIG_LIS2MDL=y
CONFIG_INA219=y
CONFIG_TMP112=y
CONFIG_VEML6031=y

CONFIG_LORA=y
CONFIG_LORA_SX126X=y

CONFIG_RTC=y
CONFIG_RTC_RV3028=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_UPDATE=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
