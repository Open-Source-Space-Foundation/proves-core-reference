; Native (host) build entry for F Prime Component UTs and SIL deployments.
; Run fprime-util from this directory:
;   cd native && fprime-util generate --ut && fprime-util build --ut --all
; then: ctest --test-dir build-fprime-automatic-native-ut -R PROVESFlightControllerReference_
; This flight pin of fprime-zephyr registers Zephyr Os/Drv modules with no
; platform guard, so the native lane lists fprime-extras only. The flight
; build still uses the root settings.ini, which includes fprime-zephyr.
[fprime]
project_root: ..
framework_path: ../lib/fprime
library_locations: ../lib/fprime-extras
default_cmake_options: FPRIME_ENABLE_FRAMEWORK_UTS=OFF
                       FPRIME_ENABLE_AUTOCODER_UTS=OFF
                       FPRIME_CMAKE_QUIET=ON
