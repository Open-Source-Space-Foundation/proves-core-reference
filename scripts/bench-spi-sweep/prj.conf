# Standalone SX1262 SPI sweep. Links into slot0 and signs with the project key so
# MCUboot on the board boots it and the bootloader stays untouched.
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="keys/proves.pem"

CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_TIMING_FUNCTIONS=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_UART_LINE_CTRL=y

# The board defconfig turns these on for flight; none are needed here, and the
# sx126x driver would otherwise own lora0 and reset the radio behind our back.
CONFIG_LORA=n
CONFIG_SENSOR=n
CONFIG_I2C=n
CONFIG_RTC=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_STREAM_FLASH=n
CONFIG_IMG_MANAGER=n
CONFIG_I2C_TCA954X=n
