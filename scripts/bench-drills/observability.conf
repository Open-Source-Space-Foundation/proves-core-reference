# Observability-only Kconfig overlay for bench drills on v5e (#593, #609).
# Adds an RTT console, thread names and an RTT shell. Radio, comms, timing
# and thread priorities stay as in the flight config.
# Build: see scripts/bench-drills/README.md. Do not add CONFIG_TRACING_USER:
# it panics v5e at early boot.

# SEGGER RTT. Writes skip when no host reads, so a detached probe never blocks.
# 16 KiB per up-buffer holds a full `kernel thread list` between host polls.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384

# Console on RTT channel 0. The CDC ACM UART carries F' frames only, so the
# UART console stays off.
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_EXTRA_EXCEPTION_INFO=y

# Thread names and per-thread execution cycles (D4 reads them). The flight
# config already enables the last two; they are pinned here because D4
# depends on them.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y

# Shell on RTT channel 1 (the console owns channel 0). `kernel thread list`.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_RTT_BUFFER=1
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_KERNEL_SHELL=y
