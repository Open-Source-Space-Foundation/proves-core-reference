name: Flash Firmware
description: Flash MCUBoot and flight software via OpenOCD, power cycling the integration hardware around it when a PSU is available.

inputs:
  power-cycle:
    description: Power cycle the board with the Korad PSU before and after flashing; "false" resets over SWD instead.
    required: false
    default: "true"
  probe-serial:
    description: Debug probe serial number; empty uses the only attached probe.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Reboot Integration Cube (before flash)
      if: inputs.power-cycle == 'true'
      shell: bash
      run: |
        ~/korad_control/.venv/bin/python ~/korad_control/korad_control.py -d /dev/ttyPWR --output 0
        sleep 3
        ~/korad_control/.venv/bin/python ~/korad_control/korad_control.py -d /dev/ttyPWR --output 1
        sleep 3

    - name: Install MCUBoot and Flight Software
      shell: bash
      env:
        POWER_CYCLE: ${{ inputs.power-cycle }}
        PROBE_SERIAL: ${{ inputs.probe-serial }}
      run: |
        OPENOCD=(~/openocd/src/openocd -s ~/openocd/tcl -f interface/cmsis-dap.cfg)
        if [ -n "$PROBE_SERIAL" ]; then
          OPENOCD+=(-c "adapter serial $PROBE_SERIAL")
        fi
        OPENOCD+=(-f target/rp2350.cfg -c "adapter speed 5000")

        # bootable.signed.hex only covers slot0, so MCUBoot goes first.
        "${OPENOCD[@]}" -c "program mcuboot.elf verify reset exit"
        sleep 3
        "${OPENOCD[@]}" -c "program bootable.signed.hex verify reset exit"
        sleep 3

        if [ "$POWER_CYCLE" != "true" ]; then
          # An SWD session can leave CPACR clobbered on RP2350; finish on a clean reset.
          "${OPENOCD[@]}" -c "init; reset run; exit"
        fi

    - name: Reboot Integration Cube (after flash)
      if: inputs.power-cycle == 'true'
      shell: bash
      run: |
        ~/korad_control/.venv/bin/python ~/korad_control/korad_control.py -d /dev/ttyPWR --output 0
        sleep 3
        ~/korad_control/.venv/bin/python ~/korad_control/korad_control.py -d /dev/ttyPWR --output 1
        sleep 3

    - name: Wait for board USB CDC ACM to enumerate
      if: inputs.power-cycle != 'true'
      shell: bash
      run: |
        for i in $(seq 1 60); do
          if ./tools/ci/detect-board-tty.sh >/dev/null 2>&1; then
            echo "Board tty enumerated after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "ERROR: board CDC ACM device did not enumerate within 60s after SWD flash"
        exit 1
