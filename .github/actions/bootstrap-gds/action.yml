name: Bootstrap GDS over UART
description: Start the GDS on the board's UART, sync the sequence number, format the filesystem, reboot the board and bring the GDS back up in sync. Exports UART_DEVICE.

inputs:
  power-cycle:
    description: Reboot the board with the Korad PSU; "false" resets over SWD instead.
    required: false
    default: "true"
  probe-serial:
    description: Debug probe serial number for the SWD reset; empty uses the only attached probe.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Detect Board TTY
      shell: bash
      run: |
        # Pick Zephyr CDC ACM by USB VID:PID 0028:000f (set in board defconfig);
        # /dev/serial/by-id does not list this device on the integration runner.
        ZEPHYR_TTY=$(./tools/ci/detect-board-tty.sh)
        echo "Selected Zephyr board tty: $ZEPHYR_TTY"
        echo "UART_DEVICE=$ZEPHYR_TTY" >> $GITHUB_ENV

    - name: Kill stale GDS processes
      shell: bash
      run: |
        ./tools/ci/kill-ci-processes.sh

    - name: Start GDS
      shell: bash
      run: |
        nohup make gds-integration UART_DEVICE="$UART_DEVICE" > gds-bootstrap.log 2>&1 &
        echo $! > server.pid

    - name: Sync Sequence Number
      shell: bash
      run: |
        make test-integration FILTER=sync_sequence_number

    - name: Format Filesystem
      shell: bash
      run: |
        make test-integration FILTER=format_filesystem

    - name: Reboot board
      shell: bash
      env:
        POWER_CYCLE: ${{ inputs.power-cycle }}
        PROBE_SERIAL: ${{ inputs.probe-serial }}
      run: |
        [ -f server.pid ] && kill $(cat server.pid) || true
        ./tools/ci/kill-ci-processes.sh
        if [ "$POWER_CYCLE" = "true" ]; then
          ./tools/ci/psu cycle
        else
          PROBE_SERIAL=${PROBE_SERIAL:-${OPENOCD_ADAPTER_SERIAL:-}}
          OPENOCD=(~/openocd/src/openocd -s ~/openocd/tcl -f interface/cmsis-dap.cfg)
          if [ -n "$PROBE_SERIAL" ]; then
            OPENOCD+=(-c "adapter serial $PROBE_SERIAL")
          fi
          "${OPENOCD[@]}" -f target/rp2350.cfg -c "adapter speed 5000" -c "init; reset run; exit"
          for i in $(seq 1 60); do
            # --once keeps this bounded at 60 s; see tools/ci/detect-board-tty.sh.
            ./tools/ci/detect-board-tty.sh --once >/dev/null 2>&1 && break
            sleep 1
          done
          sleep 15
        fi

    - name: Detect Board TTY (after reboot)
      shell: bash
      run: |
        ZEPHYR_TTY=$(./tools/ci/detect-board-tty.sh)
        echo "Selected Zephyr board tty: $ZEPHYR_TTY"
        echo "UART_DEVICE=$ZEPHYR_TTY" >> $GITHUB_ENV

    - name: Start GDS (after reboot)
      shell: bash
      run: |
        nohup make gds-integration UART_DEVICE="$UART_DEVICE" > gds.log 2>&1 &
        echo $! > server.pid

    - name: Sync Sequence Number (after reboot)
      shell: bash
      run: |
        make test-integration FILTER=sync_sequence_number
