name: unit-test

# Own workflow; skipped (not absent) on docs-only PRs so the required
# `unit-test` check still reports.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs-only: ${{ steps.docs-only.outputs.docs-only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - id: docs-only
        uses: ./.github/actions/docs-only
        with:
          github-token: ${{ github.token }}

  # `always()` so a failed `changes` runs the tests (empty output is not
  # 'true') instead of skipping them, since a skipped required check passes.
  unit-test:
    needs: changes
    if: always() && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download bin tools
        run: |
          make download-bin

      - name: Setup submodules
        run: |
          make submodules

      - name: Install lib dependencies
        run: |
          sudo apt update
          sudo apt install -y libmbedtls-dev

      - name: Run Unit Tests
        run: |
          make test-unit
