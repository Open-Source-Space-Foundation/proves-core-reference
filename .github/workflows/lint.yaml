name: lint

# Kept out of ci.yaml so it runs on every PR and push to main, including
# docs-only changes that ci.yaml skips. The job name `lint` is a required
# status check; do not rename it.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR, or to main, cancels that ref's still-running lint.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint
        run: |
          make fmt
