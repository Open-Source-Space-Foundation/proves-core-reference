name: yamcs-build

# Validates that the YAMCS server boots with the build's MDB.
# Standalone pipeline: it builds its own firmware (build.yaml) so it can run on
# any free machine in parallel with the other workflows. The `yamcs-build` job
# is the required status check.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: yamcs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs-only: ${{ steps.docs-only.outputs.docs-only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - id: docs-only
        uses: ./.github/actions/docs-only
        with:
          github-token: ${{ github.token }}

  build:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  yamcs-build:
    needs: [changes, build]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts

      - name: Restore MDB to expected path
        run: ./tools/ci/restore-yamcs-mdb.sh

      - name: Validate YAMCS server boots with current MDB
        run: |
          make yamcs-build-check

      - name: Capture compose state on failure
        if: failure()
        run: |
          docker compose -f yamcs/docker-compose.yml ps > yamcs-compose-ps.txt 2>&1 || true
          docker compose -f yamcs/docker-compose.yml logs --tail=500 > yamcs-compose-logs.txt 2>&1 || true

      - name: Upload compose state on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yamcs-build-compose-state
          path: |
            yamcs-compose-ps.txt
            yamcs-compose-logs.txt
          retention-days: 7
