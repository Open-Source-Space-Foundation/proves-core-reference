name: docs

# Runs on every PR and push to main, including docs-only changes that the
# build and test workflows skip.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install docs dependencies
        run: |
          make docs-deps

      - name: Build docs (strict)
        run: |
          ./docs-venv/bin/mkdocs build --strict

      - name: Test docs hook
        run: |
          make docs-test
