name: ci

on:
  pull_request:
  push:
    branches:
      - main

# The integration jobs only read the repository; artifact up/download uses the
# per-run artifact scope, not contents: write.
permissions:
  contents: read

# A new push to a PR, or to main, cancels that ref's still-running jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the change so the build/integration jobs can skip
  # documentation-only PRs. Pushes to main always run everything. Lint, docs
  # and unit-test live in their own workflows.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs-only: ${{ steps.docs-only.outputs.docs-only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - id: docs-only
        uses: ./.github/actions/docs-only
        with:
          github-token: ${{ github.token }}

  build:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  integration-uart:
    needs: [changes, build]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/integration-uart.yaml
    secrets: inherit

  integration-radio:
    needs: [changes, build]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/integration-radio.yaml
    secrets: inherit

  yamcs-build:
    needs: [changes, build]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/yamcs-build.yaml
